<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1930"><title>Python 定量分析法｜第五單元</title>
<style>
:root{color-scheme:dark;--bg:#081321;--panel:#101f32;--edge:#28405e;--text:#edf5ff;--muted:#aac0d7;--accent:#64baff}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px max(18px,3vw);border-bottom:1px solid var(--edge)}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);margin-top:5px}.tools{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #41617e;background:#1b3654;color:var(--text);padding:10px 13px;border-radius:9px;font:inherit}button:hover,button:focus-visible{background:#28527c}button:disabled{opacity:.4;cursor:default}.primary{background:#1768a6;border-color:#398ac7}main{width:min(1600px,96vw);margin:18px auto}.slide-frame{width:100%;aspect-ratio:16/9;background:#000;display:grid;place-items:center;box-shadow:0 12px 36px #0008;border:1px solid var(--edge);border-radius:10px;overflow:hidden}.slide-frame img{width:100%;height:100%;object-fit:contain}.nav{display:flex;gap:12px;justify-content:center;align-items:center;margin:16px auto}.nav .count{font-variant-numeric:tabular-nums;min-width:105px;text-align:center;color:#dcecff}.notes{margin:18px auto 24px;padding:20px 24px;border:1px solid var(--edge);border-radius:12px;background:var(--panel);line-height:1.95;font-size:17px;white-space:pre-wrap}.notes h2{font-size:18px;margin:0 0 10px;color:#9dd3ff;white-space:normal}.notes[hidden],dialog[hidden]{display:none}dialog{position:fixed;inset:5vh 4vw;max-height:90vh;max-width:1300px;width:92vw;background:#0c1b2d;color:var(--text);border:1px solid var(--edge);border-radius:12px;padding:18px;overflow:auto}dialog::backdrop{background:#000b}.overview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.thumb{background:#142b45;border:1px solid var(--edge);border-radius:9px;text-align:left;padding:7px;overflow:hidden}.thumb img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;background:#fff;border-radius:4px}.thumb span{display:block;padding:8px 4px 3px;color:var(--muted);font-size:13px}.thumb.active{border:2px solid var(--accent)}.help{text-align:center;color:var(--muted);font-size:13px;margin:20px}.present:fullscreen{background:#000;display:grid;place-items:center}.present:fullscreen .slide-frame{border:none;box-shadow:none;border-radius:0;width:min(100vw,177.77778vh);height:auto}.present:fullscreen img{width:100%}@media(max-width:700px){header{padding:12px}.brand b{font-size:16px}.tools button{padding:9px;font-size:13px}main{width:100vw;margin:10px 0}.slide-frame{border-radius:0}.notes{border-radius:0;padding:15px;font-size:15px}.nav{margin:12px auto}.help{padding:0 14px}}
</style></head><body><header><div class="brand"><b>Python 第五單元｜定量分析法</b><small>國立臺灣師範大學・化學系｜16:9 網路講義</small></div><div class="tools"><button id="notesBtn" aria-pressed="false">顯示講稿</button><button id="overviewBtn">全部頁面</button><button id="fullBtn">全螢幕</button></div></header><main><section id="present" class="present"><div class="slide-frame"><img id="slideImage" alt="教學投影片"></div></section><div class="nav"><button id="prevBtn">← 上一頁</button><span id="count" class="count"></span><button id="nextBtn">下一頁 →</button></div><section id="notes" class="notes" hidden><h2 id="notesTitle">教師演講稿</h2><div id="notesText"></div></section><p class="help">← → 翻頁 ｜ N 顯示／隱藏講稿 ｜ F 全螢幕 ｜ G 頁面總覽 ｜ Esc 離開全螢幕</p></main><dialog id="overviewDialog"><div class="overview-head"><strong>選擇投影片</strong><button id="closeOverview">關閉 ✕</button></div><div id="overview" class="overview"></div></dialog><script src="data.js"></script><script>
(()=>{'use strict';const slides=window.SLIDES||[];let current=0,showNotes=false;const $=id=>document.getElementById(id);const img=$('slideImage'),count=$('count'),notes=$('notes'),notesText=$('notesText'),notesBtn=$('notesBtn'),dlg=$('overviewDialog');function go(n){if(n<0||n>=slides.length)return;current=n;const s=slides[n];img.src=s.image;img.alt=`第 ${n+1} 頁：${s.title}`;count.textContent=`${n+1} / ${slides.length}`;notesText.textContent=s.notes||'本頁未提供講稿';$('notesTitle').textContent=`第 ${n+1} 頁｜教師演講稿`;notes.hidden=!showNotes;$('prevBtn').disabled=n===0;$('nextBtn').disabled=n===slides.length-1;document.querySelectorAll('.thumb').forEach((el,i)=>el.classList.toggle('active',i===n));history.replaceState(null,'',`#slide-${n+1}`)}function toggleNotes(){showNotes=!showNotes;notes.hidden=!showNotes;notesBtn.textContent=showNotes?'隱藏講稿':'顯示講稿';notesBtn.setAttribute('aria-pressed',String(showNotes))}function openOverview(){dlg.showModal()}$('prevBtn').onclick=()=>go(current-1);$('nextBtn').onclick=()=>go(current+1);notesBtn.onclick=toggleNotes;$('overviewBtn').onclick=openOverview;$('closeOverview').onclick=()=>dlg.close();$('fullBtn').onclick=()=>{let el=$('present');if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen()};slides.forEach((s,i)=>{const b=document.createElement('button');b.className='thumb';const thumb=document.createElement('img');thumb.src=s.image;thumb.loading='lazy';thumb.alt=`第${i+1}頁縮圖`;const label=document.createElement('span');label.textContent=`第 ${i+1} 頁`;b.append(thumb,label);b.onclick=()=>{go(i);dlg.close()};$('overview').appendChild(b)});document.addEventListener('keydown',e=>{if(dlg.open)return;if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='n')toggleNotes();else if(e.key.toLowerCase()==='g')openOverview();else if(e.key.toLowerCase()==='f')$('fullBtn').click()});const init=Number((location.hash.match(/slide-(\d+)/)||[])[1]);go(Number.isFinite(init)&&init>=1&&init<=slides.length?init-1:0)})();
</script></body></html>
